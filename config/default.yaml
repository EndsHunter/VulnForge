# vulnforge default config â€” local LM Studio / Ornith

llm:
  # OpenAI-compatible endpoint (LM Studio default local bind)
  base_url: "http://127.0.0.1:1234/v1"
  # Exact model id as exposed by /v1/models (LM Studio Ornith is usually lowercase)
  model: "ornith-1.0-35b@4bit"
  display_name: "Ornith 1.0 35B 4bit"
  # Toolgen (Dev → Generate tool) uses these when present
  temperature_code: 0.15
  toolgen_max_tokens: 8192
  # Optional. Blank, none, or null → no Authorization header. Dummy "lm-studio"
  # is fine for local OpenAI-compatible servers that require any Bearer string.
  api_key: "lm-studio"
  # HTTP API surface: chat_completions | responses | messages
  # chat_completions → POST /v1/chat/completions (OpenAI classic; LM Studio default)
  # responses        → POST /v1/responses (OpenAI Responses API)
  # messages         → POST /v1/messages (Anthropic-style Messages API)
  api_mode: chat_completions
  max_context_fraction: 0.25
  max_tool_rounds: 12
  temperature_hunt: 0.4
  temperature_disprove: 0.1
  temperature_recon: 0.3
  timeout_seconds: 600
  retry_infra: 3
  # Ornith-class reasoning models need headroom beyond answer tokens
  max_tokens: 4096
  context_tokens: 32768
  # Dual adversarial disprove (validate_llm). Sole job: try to kill the finding.
  # Per-slot model override is reserved for later (omit = inherit llm.model).
  disprove_verifiers:
    - id: threat_model
      prompt: disprove_threat.md
    - id: code_mitigation
      prompt: disprove_code.md

run:
  profile: code_static
  max_tasks: 50
  max_task_attempts: 3       # infra requeues until attempt >= this â†’ deadletter
  max_split_depth: 2         # P1.5 auto-split ladder cap (L0â†’L2)
  # Wall clock is only via Ralph --max-wall-seconds or a dev loop profile
  # (e.g. quick-smoke). Operator Mission Start never sets a wall.
  max_leases_parallel: 1
  lease_ttl_seconds: 1800
  auto_tool_gaps: false       # on idle run-once after render, write tool gap reports
  tool_gaps_mode: mechanical  # mechanical | llm | hybrid (Home "Analyze with AI" uses hybrid)
  max_recon_auto_retries: 2   # child recon generations after recoverable failed_task
  # After recon, merge new map with prior via LLM (mechanical fallback on failure)
  architecture_llm_merge: true
  # Keep post-agent merge bounded so recon handoff cannot hang on local LLMs
  architecture_merge_timeout_seconds: 120
  architecture_merge_max_tokens: 2048
  runs_root: "runs"          # relative to cwd or absolute
  ignore_globs:
    - ".git/**"
    - "node_modules/**"
    - "venv/**"
    - ".venv/**"
    - "dist/**"
    - "build/**"
    - "**/__pycache__/**"
    - "runs/**"
    # Large-tree / desktop hygiene (Desktop-scale targets)
    - "**/.cache/**"
    - "**/AppData/**"
    - "**/.npm/**"
    - "**/.cargo/**"
    - "**/Library/**"
    - "**/*.iso"
    - "**/*.vmdk"
    - "**/*.vhdx"
    - "**/System Volume Information/**"
    - "**/$RECYCLE.BIN/**"

stages:
  validate_llm: false
  gapfill: false
  dedup: false
  feedback: false

packet:
  max_architecture_chars: 1800   # P1.2 slim hunt packet (area slice)
  max_architecture_merge_chars: 6000  # prior+incoming JSON budget for LLM merge
  max_file_slice_chars: 4000
  max_codemap_entries: 12
  max_known_keys: 20
  max_known_findings: 20
  max_seed_sinks: 12
  max_hunt_angles: 4

tools:
  max_read_bytes: 65536
  max_grep_matches: 50
  max_list_entries: 200
  max_inventory_entries: 2000
  max_inventory_depth: 10
  max_evidence_bytes: 1048576
  max_grep_pattern_len: 200
  grep_timeout_seconds: 8
  max_grep_files: 8000

# Binary reverse-engineering (profile binary_re) — PE only in v1.
# Requires --i-am-authorized-for-binary-re or i_am_authorized: true.
# Ghidra MCP: https://github.com/bethington/ghidra-mcp (HTTP on :8089 by default).
#
# Portable layout (paths relative to the VulnForge project root / VULNFORGE_ROOT):
#   ghidra/           Ghidra distribution (ghidraRun.bat, Ghidra/, support/)
#   ghidra-mcp/       clone + build of bethington/ghidra-mcp
#   scripts/start_ghidra_mcp_headless.ps1
# headless_command is auto-built when null — no absolute machine paths needed.
binary_re:
  i_am_authorized: false
  ghidra_install_dir: "ghidra"
  mcp_base_url: "http://127.0.0.1:8089"
  headless_command: null
  headless_script: "scripts/start_ghidra_mcp_headless.ps1"
  headless_cwd: null
  ghidra_mcp_repo: "ghidra-mcp"
  ghidra_mcp_jar: null
  start_timeout_seconds: 180
  analyze_timeout_seconds: 600
  # Per-run Ghidra project dir under the run folder (not the Ghidra install)
  project_subdir: "ghidra_project"
  allowed_extensions:
    - ".exe"
    - ".dll"
  max_decompile_chars: 24000
  max_list_page: 100
  request_timeout_seconds: 45
