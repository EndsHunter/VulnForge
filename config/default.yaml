# vulnforge default config â€” local LM Studio / Ornith

llm:
  # OpenAI-compatible endpoint (LM Studio default local bind)
  base_url: "http://127.0.0.1:1234/v1"
  # Exact model id as exposed by /v1/models (LM Studio Ornith is usually lowercase)
  model: "ornith-1.0-35b"
  display_name: "Ornith 1.0 35B"
  # Toolgen (Dev → Generate tool) uses these when present
  temperature_code: 0.15
  toolgen_max_tokens: 8192
  # Optional. Blank, none, or null → no Authorization header. Dummy "lm-studio"
  # is fine for local OpenAI-compatible servers that require any Bearer string.
  api_key: "lm-studio"
  # HTTP API surface: chat_completions | responses | messages
  # chat_completions → POST /v1/chat/completions (OpenAI classic; LM Studio default)
  # responses        → POST /v1/responses (OpenAI Responses API)
  # messages         → POST /v1/messages (Anthropic-style Messages API)
  api_mode: chat_completions
  max_context_fraction: 0.25
  max_tool_rounds: 12
  # When the agent hits max_tool_rounds / no_submit, auto-call submit_none
  # (hunt) or a minimal submit_architecture (recon) so the task finishes.
  force_submit_on_round_limit: true
  # Multi-agent recon when multiple recon agents are active:
  #   ralph     — fan out one Ralph task per agent (default, durable)
  #   inprocess — all agents sequential in one task (Strands loop)
  #   graph     — sequential Strands Graph pipeline in one task
  recon_orchestrator: ralph
  temperature_hunt: 0.4
  temperature_disprove: 0.1
  temperature_recon: 0.3
  timeout_seconds: 600
  retry_infra: 3
  # Ornith-class reasoning models need headroom beyond answer tokens
  max_tokens: 4096
  context_tokens: 32768
  # Dual adversarial disprove (validate_llm). Sole job: try to kill the finding.
  # Never confirms; never raises severity. Same-model disprove is still weak signal.
  # Default ON (stages.validate_llm: true). Set false to skip for speed/debug and
  # send mech-pass straight to human review. Override prompts under
  # config/prompts/overrides/disprove*.md for stricter severity honesty.
  # Per-slot model override still supported on each verifier entry.
  # Prefer llm.validate_models (1+) for multi-model agreement — UI Settings page.
  disprove_verifiers:
    - id: threat_model
      prompt: disprove_threat.md
    - id: code_mitigation
      prompt: disprove_code.md
  # Per-stage model overrides (blank → llm.model). Owned by Settings UI when present.
  model_recon: ""
  model_hunt: ""
  model_develop_poc: ""
  # Multi-model validation list (1+). Empty → [llm.model]. Disprove + PoC referee.
  validate_models: []
  # all | majority — agreement required for positive multi-model “valid” signals
  validate_consensus: majority

run:
  profile: code_static
  max_tasks: 50
  max_task_attempts: 3       # infra requeues until attempt >= this â†’ deadletter
  max_split_depth: 2         # P1.5 auto-split ladder cap (L0â†’L2)
  # Wall clock is only via Ralph --max-wall-seconds or a dev loop profile
  # (e.g. quick-smoke). Operator Mission Start never sets a wall.
  max_leases_parallel: 1
  lease_ttl_seconds: 1800
  auto_tool_gaps: false       # on idle run-once after render, write tool gap reports
  tool_gaps_mode: mechanical  # mechanical | llm | hybrid (Home "Analyze with AI" uses hybrid)
  max_recon_auto_retries: 2   # child recon generations after recoverable failed_task
  # After recon, merge new map with prior via LLM (mechanical fallback on failure)
  architecture_llm_merge: true
  # Keep post-agent merge bounded so recon handoff cannot hang on local LLMs
  architecture_merge_timeout_seconds: 120
  architecture_merge_max_tokens: 2048
  runs_root: "runs"          # relative to cwd or absolute
  ignore_globs:
    - ".git/**"
    - "node_modules/**"
    - "venv/**"
    - ".venv/**"
    - "dist/**"
    - "build/**"
    - "**/__pycache__/**"
    - "runs/**"
    # Large-tree / desktop hygiene (Desktop-scale targets)
    - "**/.cache/**"
    - "**/AppData/**"
    - "**/.npm/**"
    - "**/.cargo/**"
    - "**/Library/**"
    - "**/*.iso"
    - "**/*.vmdk"
    - "**/*.vhdx"
    - "**/System Volume Information/**"
    - "**/$RECYCLE.BIN/**"

stages:
  # Dual-LLM disprove after validate_mech pass (default ON).
  # true: run threat_model + code_mitigation verifiers; both reject → rejected_llm;
  #       any stand/hold → still needs_human (never auto-confirmed).
  # false: skip LLM disprove — mech pass → needs_human for human review only
  #        (use for speed, debug, or when same-model disprove adds noise).
  # See docs/harness/validate/README.md and seeds/system/disprove.md.
  validate_llm: true
  # Multi-model PoC referee after harness run (default on; never auto-confirm)
  validate_poc_referee: true

# Controlled PoC execution harness (validate_poc stage / Report workshop).
# Never writes to the audit target. Never sets confirmed.
# Safe defaults: docker + network none. Hub frontmatter may set network: allow.
# Without Docker: set runner: local_subprocess (network not restricted on local).
poc_harness:
  enabled: true
  # docker (preferred) | local_subprocess
  runner: docker
  timeout_s: 60
  # none | allow  (none → docker --network=none; hub frontmatter can override)
  network: none
  allow_write_target: false
  docker_image: "python:3.12-slim"
  # blank → sys.executable (local_subprocess only)
  python: ""

# Mechanical codemap (structure scaffold for recon + hunt targeting).
# Full map (modules + files + symbols) is stored in runs.codemap_json.
# Hunt packets get an area slice only (path_hints / area) — not the whole dump.
codemap:
  enabled: true
  max_modules: 80
  max_depth: 4
  max_edges: 120
  max_import_files_scan: 200
  build_import_edges: true
  # Function/class layer (full store; optional tree-sitter via vulnforge[codemap])
  symbols_enabled: true
  symbol_backend: auto          # auto | tree_sitter | heuristic | none
  max_symbol_files: 5000
  max_symbols: 100000
  max_symbols_per_file: 500
  max_signature_chars: 240
  # Hunt / tool packet budgets (not storage caps)
  packet_max_modules: 8
  packet_max_files: 40
  packet_max_symbols: 60
  packet_prefer_kinds: [function, method, class]

packet:
  max_architecture_chars: 1800   # P1.2 slim hunt packet (area slice)
  max_architecture_merge_chars: 6000  # prior+incoming JSON budget for LLM merge
  max_file_slice_chars: 4000
  max_codemap_entries: 12
  max_codemap_chars: 3500         # area slice may include function signatures
  max_known_keys: 20
  max_known_findings: 20
  max_seed_sinks: 12
  max_hunt_angles: 4

tools:
  max_read_bytes: 65536
  max_read_bytes_hard: 262144
  max_read_batch: 8
  default_read_radius: 40
  max_grep_matches: 50
  max_grep_line_chars: 200
  max_grep_context: 10
  max_list_entries: 200
  max_inventory_entries: 2000
  max_inventory_depth: 10
  max_evidence_bytes: 1048576
  max_grep_pattern_len: 200
  grep_timeout_seconds: 8
  max_grep_files: 8000
  max_symbol_matches: 40
  # query_flows (coarse import/call reachability — not taint)
  max_flow_edges: 40
  max_flow_depth: 2
  max_flow_call_files: 200
