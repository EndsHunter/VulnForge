# Ephemeral override for notepad binary_re smoke (local Ornith @ 10.0.0.232)
llm:
  base_url: "http://10.0.0.232:1234/v1"
  model: "mlx-community/ornith-1.0-35b"
  display_name: "Ornith 1.0 35B (MLX remote)"
  api_key: "lm-studio"
  api_mode: chat_completions
  max_context_fraction: 0.25
  max_tool_rounds: 16
  temperature_hunt: 0.4
  temperature_disprove: 0.1
  temperature_recon: 0.3
  timeout_seconds: 900
  retry_infra: 3
  max_tokens: 4096
  context_tokens: 32768

run:
  profile: binary_re
  max_tasks: 20
  max_task_attempts: 3
  max_leases_parallel: 1
  lease_ttl_seconds: 2400
  runs_root: "runs"

stages:
  validate_llm: false
  gapfill: false
  dedup: false
  feedback: false

binary_re:
  i_am_authorized: true
  ghidra_install_dir: "ghidra"
  mcp_base_url: "http://127.0.0.1:8089"
  headless_command: null
  headless_script: "scripts/start_ghidra_mcp_headless.ps1"
  start_timeout_seconds: 300
  analyze_timeout_seconds: 900
  project_subdir: "ghidra_project"
  allowed_extensions:
    - ".exe"
    - ".dll"
