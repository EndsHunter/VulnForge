<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Chat | VulnForge</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/static/logo.png" />
  <link rel="apple-touch-icon" href="/static/logo.png" />
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="/static/shell.css" />
  <link rel="stylesheet" href="/static/pages/chat.css" data-vf-chat-css="1" />
</head>
<body data-page="chat" data-chat-scope="home">
  <main class="vf-chat-page">
    <header class="vf-chat-head">
      <a href="/" class="home-mark" title="Home - all runs"><img class="logo" src="/static/logo.svg" width="28" height="28" alt="VulnForge"></a>
      <h1 class="vf-chat-title">AI chat</h1>
      <span class="vf-pill">Fleet co-pilot</span>
      <span class="vf-spacer"></span>
      <a class="vf-btn vf-btn--ghost" href="/" title="All runs">Runs</a>
      <details class="danger-menu vf-chat-menu">
        <summary class="vf-btn vf-btn--ghost" title="Operator tools" aria-label="Operator tools">···</summary>
        <nav class="danger-menu-body" aria-label="Operator tools">
          <a href="/settings" id="btn-settings" class="vf-menu-link">Settings</a>
          <a href="/dev" id="btn-open-dev" class="vf-menu-link">Dev</a>
          <a href="/benchmarks" id="btn-open-benchmarks" class="vf-menu-link">Benchmarks</a>
          <a href="/tool-gaps" id="btn-open-tool-gaps" class="vf-menu-link">Tool gaps</a>
          <hr />
          <div class="vf-chat-root-path vf-mono" title="Runs root">{{ runs_root }}</div>
        </nav>
      </details>
    </header>
    <div id="operator-chat-root" class="operator-chat-root"></div>
  </main>

  <script src="/static/chat.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      window.VulnForgeChat?.mount(document.getElementById("operator-chat-root"), {
        scope: "home",
        chips: [
          "List all runs",
          "What needs_human findings exist across all runs?",
          "Summarize results across runs",
          "What hunts are queued or aborted?",
          "Explain VulnForge honesty rules",
        ],
      });
    });
  </script>
</body>
</html>
