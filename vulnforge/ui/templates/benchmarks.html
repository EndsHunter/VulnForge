<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Benchmarks | VulnForge</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/static/logo.png" />
  <link rel="apple-touch-icon" href="/static/logo.png" />
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="/static/shell.css" />
  <link rel="stylesheet" href="/static/pages/bench/bench.css" />
</head>
<body data-page="benchmarks" data-bench-view="{{ view }}">
  <div class="bench-desk">
    <header class="bench-head">
      <a href="/" class="home-mark" title="Home"><img class="logo" src="/static/logo.svg" width="28" height="28" alt="VulnForge"></a>
      <h1 class="bench-title">Benchmarks</h1>
      <nav class="vf-tabs" aria-label="Benchmarks">
        <a class="vf-tab" href="/benchmarks" {% if view in ('scoreboard', 'run', 'compare') %}aria-current="page" aria-selected="true"{% endif %}>Scoreboard</a>
        <a class="vf-tab" href="/benchmarks/cases" {% if view == 'cases' %}aria-current="page" aria-selected="true"{% endif %}>Cases</a>
      </nav>
      <span class="vf-spacer"></span>
      <button type="button" class="vf-btn" id="ai-entry" aria-expanded="false" title="Ask across runs">AI</button>
      <details class="danger-menu bench-menu">
        <summary class="btn btn-ghost" title="Operator tools" aria-label="Operator tools">···</summary>
        <nav class="danger-menu-body" aria-label="Operator tools">
          <a href="/" class="vf-menu-link">Home</a>
          <a href="/settings" class="vf-menu-link">Settings</a>
          <a href="/dev" class="vf-menu-link">Dev</a>
          <a href="/tool-gaps" class="vf-menu-link">Tool gaps</a>
        </nav>
      </details>
    </header>

    <main id="bench-root" class="bench-main"
          data-run-id="{{ run_id or '' }}"
          data-compare-a="{{ compare_a or '' }}"
          data-compare-b="{{ compare_b or '' }}">
      <div class="vf-empty">Loading…</div>
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="ai-sheet" class="ai-sheet" hidden>
    <header class="ai-head">
      <div id="ai-title">Across runs</div>
      <div class="ai-head-actions">
        <button type="button" id="ai-max" aria-pressed="false">Expand</button>
        <button type="button" id="ai-close" aria-label="Close">Close</button>
      </div>
    </header>
    <div id="operator-chat-root" class="operator-chat-root" data-chat-scope="home"></div>
  </div>
  <script src="/static/pages/bench/helpers.js"></script>
  <script src="/static/pages/bench/desk.js"></script>
  <script src="/static/pages/bench/scoreboard.js"></script>
  <script src="/static/pages/bench/run.js"></script>
  <script src="/static/pages/bench/cases.js"></script>
  <script src="/static/chat.js"></script>
</body>
</html>
