[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnforge"
version = "0.1.0"
description = "Local model-agnostic vulnerability research harness (VulnForge; Strands Agents runtime)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["security", "llm", "vulnerability", "audit", "lm-studio"]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  # Findings export (xlsx/docx) + recon_docs PDF ingest
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "pypdf>=4.0",
  # Default agent runtime (hunt / recon / develop_poc / operator chat)
  "strands-agents[openai]>=1.50.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
# Kept for older install hints: pip install 'vulnforge[export]'
export = ["openpyxl>=3.1", "python-docx>=1.1", "pypdf>=4.0"]
# Function-level codemap via tree-sitter (heuristic backend works without this)
codemap = [
  "tree-sitter>=0.22",
  "tree-sitter-language-pack>=0.3",
]

[project.scripts]
vf = "vulnforge.cli:main"

[tool.setuptools.packages.find]
include = ["vulnforge*"]

[tool.setuptools.package-data]
vulnforge = ["ui/templates/*", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--basetemp=.pytest_tmp"]
markers = [
  "live: hits a real LLM endpoint (requires VF_LIVE=1)",
]
